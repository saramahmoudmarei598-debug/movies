<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الوصفات - Forkify</title>
    <style>
        :root {
            --primary-color: #f39c12;
            --background-color: #141414;
            --card-background: #1f1f1f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }

        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0b0b0b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .logo h1 { font-size: 1.8rem; }
        .logo span { color: var(--primary-color); }

        #form { display: flex; gap: 10px; }

        .search {
            background-color: #2b2b2b;
            border: 2px solid transparent;
            border-radius: 25px;
            padding: 0.6rem 1.2rem;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            width: 250px;
        }

        .search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(243, 156, 18, 0.5);
        }

        .btn-search {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .section-title { padding: 2rem 3rem 0; }
        .section-title h2 {
            border-right: 4px solid var(--primary-color);
            padding-right: 10px;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 2rem;
            gap: 20px;
        }

        .recipe {
            width: 260px;
            background-color: var(--card-background);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .recipe img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .recipe-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .recipe-info h3 {
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recipe-info p { font-size: 0.85rem; color: #aaa; }

        .btn-details {
            margin-top: 8px;
            padding: 0.6rem;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-background);
            padding: 2rem;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #fff;
        }

        .ingredients-list {
            margin-top: 10px;
            padding-right: 20px;
        }

        .ingredients-list li { margin-bottom: 5px; }

        .source-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--primary-color);
            text-decoration: underline;
        }

        .no-results { text-align: center; margin-top: 3rem; color: #888; }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>عالم <span>الوصفات</span></h1>
        </div>
        <form id="form">
            <input type="text" id="search" class="search" placeholder="ابحث عن وصفة (pizza, burger...)...">
            <button type="submit" class="btn-search">بحث</button>
        </form>
    </header>

    <div class="section-title">
        <h2 id="title-heading">الوصفات المقترحة 🍳</h2>
    </div>

    <main id="main"></main>

    <!-- النافذة المنبثقة للوصفة -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://forkify-api.jonas.io/api/v2/recipes';

        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');
        const modal = document.getElementById('modal');
        const modalBody = document.getElementById('modal-body');
        const closeModal = document.getElementById('close-modal');

        getRecipes('pizza');

        async function getRecipes(query) {
            main.innerHTML = '<h3 class="no-results">جاري تحميل الوصفات...</h3>';
            try {
                const res = await fetch(`${API_BASE_URL}?search=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data.data && data.data.recipes && data.data.recipes.length > 0) {
                    showRecipes(data.data.recipes);
                } else {
                    main.innerHTML = '<h3 class="no-results">لم يتم العثور على أي نتائج.</h3>';
                }
            } catch (error) {
                main.innerHTML = '<h3 class="no-results">حدث خطأ أثناء جلب الوصفات.</h3>';
            }
        }

        function showRecipes(recipes) {
            main.innerHTML = '';

            recipes.forEach((recipe) => {
                const { title, image_url, publisher, id } = recipe;

                const recipeEl = document.createElement('div');
                recipeEl.classList.add('recipe');

                recipeEl.innerHTML = `
                    <img src="${image_url}" alt="${title}">
                    <div class="recipe-info">
                        <h3>${title}</h3>
                        <p>بواسطة: ${publisher}</p>
                        <button class="btn-details" onclick="getRecipeDetails('${id}')">عرض التفاصيل والمقادير</button>
                    </div>
                `;

                main.appendChild(recipeEl);
            });
        }

        async function getRecipeDetails(id) {
            modalBody.innerHTML = '<h3>جاري تحميل المقادير...</h3>';
            modal.style.display = 'flex';

            try {
                const res = await fetch(`${API_BASE_URL}/${id}`);
                const data = await res.json();
                const recipe = data.data.recipe;

                let ingredientsHTML = '<ul class="ingredients-list">';
                recipe.ingredients.forEach(ing => {
                    const quantity = ing.quantity ? ing.quantity : '';
                    const unit = ing.unit ? ing.unit : '';
                    ingredientsHTML += `<li>${quantity} ${unit} ${ing.description}</li>`;
                });
                ingredientsHTML += '</ul>';

                modalBody.innerHTML = `
                    <h2>${recipe.title}</h2>
                    <p style="margin-top: 5px; color: #aaa;">وقت التحضير: ${recipe.cooking_time} دقيقة | الوجبات: ${recipe.servings}</p>
                    <h3 style="margin-top: 15px; color: var(--primary-color);">المقادير:</h3>
                    ${ingredientsHTML}
                    <a class="source-link" href="${recipe.source_url}" target="_blank">الموقع الأصلي للخطوات الكاملة 🔗</a>
                `;
            } catch (error) {
                modalBody.innerHTML = '<h3>حدث خطأ أثناء جلب تفاصيل الوصفة.</h3>';
            }
        }

        closeModal.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const searchTerm = search.value.trim();
            if (searchTerm) {
                getRecipes(searchTerm);
                search.value = '';
            }
        });
    </script>
</body>
</html>
