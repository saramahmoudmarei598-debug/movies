<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وصفات الطعام - Forkify</title>
    <style>
        :root {
            --primary-color: #f39c12;
            --background-color: #141414;
            --card-background: #1f1f1f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }

        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0b0b0b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .logo h1 {
            font-size: 1.8rem;
        }

        .logo span {
            color: var(--primary-color);
        }

        #form {
            display: flex;
            gap: 10px;
        }

        .search {
            background-color: #2b2b2b;
            border: 2px solid transparent;
            border-radius: 25px;
            padding: 0.6rem 1.2rem;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            width: 250px;
        }

        .search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(243, 156, 18, 0.5);
        }

        .btn-search {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn-search:hover {
            background-color: #d35400;
        }

        .section-title {
            padding: 2rem 3rem 0;
        }

        .section-title h2 {
            border-right: 4px solid var(--primary-color);
            padding-right: 10px;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 2rem;
            gap: 20px;
        }

        .recipe {
            width: 260px;
            background-color: var(--card-background);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .recipe:hover {
            transform: translateY(-8px);
        }

        .recipe img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .recipe-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .recipe-info h3 {
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recipe-info p {
            font-size: 0.85rem;
            color: #aaa;
        }

        .recipe-info a {
            display: inline-block;
            margin-top: 8px;
            padding: 0.5rem 1rem;
            background-color: var(--primary-color);
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.3s;
        }

        .recipe-info a:hover {
            background-color: #d35400;
        }

        .no-results {
            text-align: center;
            margin-top: 3rem;
            font-size: 1.2rem;
            color: #888;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>عالم <span>الوصفات</span></h1>
        </div>
        <form id="form">
            <input type="text" id="search" class="search" placeholder="ابحث عن وصفة (pizza, burger...)...">
            <button type="submit" class="btn-search">بحث</button>
        </form>
    </header>

    <div class="section-title">
        <h2 id="title-heading">الوصفات المقترحة 🍳</h2>
    </div>

    <main id="main"></main>

    <script>
        const API_BASE_URL = 'https://forkify-api.jonas.io/api/v2/recipes';

        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');
        const titleHeading = document.getElementById('title-heading');

        // جلب وصفات البيتزا افتراضياً عند فتح الصفحة
        getRecipes('pizza');

        async function getRecipes(query) {
            main.innerHTML = '<h3 class="no-results">جاري تحميل الوصفات...</h3>';
            try {
                const res = await fetch(`${API_BASE_URL}?search=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data.data && data.data.recipes && data.data.recipes.length > 0) {
                    showRecipes(data.data.recipes);
                } else {
                    main.innerHTML = '<h3 class="no-results">لم يتم العثور على أي وصفات. جربي البحث باللغة الإنجليزية (مثل: pizza, pasta, salad).</h3>';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                main.innerHTML = '<h3 class="no-results">حدث خطأ أثناء جلب الوصفات.</h3>';
            }
        }

        function showRecipes(recipes) {
            main.innerHTML = '';

            recipes.forEach((recipe) => {
                const { title, image_url, publisher, id } = recipe;

                const recipeEl = document.createElement('div');
                recipeEl.classList.add('recipe');

                recipeEl.innerHTML = `
                    <img src="${image_url}" alt="${title}">
                    <div class="recipe-info">
                        <h3>${title}</h3>
                        <p>بواسطة: ${publisher}</p>
                        <a href="https://forkify-v2.netlify.app/#${id}" target="_blank">عرض الوصفة الكاملة</a>
                    </div>
                `;

                main.appendChild(recipeEl);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const searchTerm = search.value.trim();

            if (searchTerm && searchTerm !== '') {
                titleHeading.textContent = `نتائج البحث عن: ${searchTerm} 🔍`;
                getRecipes(searchTerm);
                search.value = '';
            }
        });
    </script>
</body>
</html>
