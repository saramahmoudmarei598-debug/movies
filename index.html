<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما تفاعلية - منصة الأفلام والترشيحات</title>
    <style>
        :root {
            --primary-color: #e50914;
            --background-color: #141414;
            --card-background: #1f1f1f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }

        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0b0b0b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .logo h1 {
            font-size: 1.8rem;
        }

        .logo span {
            color: var(--primary-color);
        }

        #form {
            display: flex;
            gap: 10px;
        }

        .search {
            background-color: #2b2b2b;
            border: 2px solid transparent;
            border-radius: 25px;
            padding: 0.6rem 1.2rem;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            width: 250px;
        }

        .search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.5);
        }

        .btn-search {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn-search:hover {
            background-color: #b80710;
        }

        .section-title {
            padding: 2rem 3rem 0;
        }

        .section-title h2 {
            border-right: 4px solid var(--primary-color);
            padding-right: 10px;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 2rem;
            gap: 20px;
        }

        .movie {
            width: 240px;
            background-color: var(--card-background);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .movie:hover {
            transform: translateY(-8px);
        }

        .movie img {
            width: 100%;
            height: 360px;
            object-fit: cover;
        }

        .movie-info {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .movie-info h3 {
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }

        .movie-info span {
            background-color: #111;
            padding: 0.3rem 0.6rem;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .movie-info span.green { color: #2ed573; }
        .movie-info span.orange { color: #ffa500; }
        .movie-info span.red { color: #ff4757; }

        .overview {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            padding: 1.2rem;
            max-height: 100%;
            transform: translateY(101%);
            transition: transform 0.3s ease-in-out;
            overflow-y: auto;
        }

        .movie:hover .overview {
            transform: translateY(0);
        }

        .overview h3 {
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .no-results {
            text-align: center;
            margin-top: 3rem;
            font-size: 1.2rem;
            color: #888;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>سينما <span>تفاعلية</span></h1>
        </div>
        <form id="form">
            <input type="text" id="search" class="search" placeholder="ابحث عن فيلمك المفضل...">
            <button type="submit" class="btn-search">بحث</button>
        </form>
    </header>

    <div class="section-title">
        <h2>الأفلام الأكثر شهرة 🔥</h2>
    </div>

    <main id="main"></main>

    <script>
        // مفتاح مفعل لتجربة جلب الأفلام مباشرة
        const API_KEY = '3fd2b7b26d871ca751ee5923063899f4';

        const API_URL = `https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}&language=ar`;
        const SEARCH_API = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=ar&query=`;
        const IMG_PATH = 'https://image.tmdb.org/t/p/w500';

        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');

        getMovies(API_URL);

        async function getMovies(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    showMovies(data.results);
                } else {
                    main.innerHTML = '<h3 class="no-results">لم يتم العثور على أي نتائج.</h3>';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                main.innerHTML = '<h3 class="no-results">حدث خطأ أثناء جلب البيانات.</h3>';
            }
        }

        function showMovies(movies) {
            main.innerHTML = '';

            movies.forEach((movie) => {
                const { title, poster_path, vote_average, overview } = movie;

                const movieEl = document.createElement('div');
                movieEl.classList.add('movie');

                const imageSrc = poster_path 
                    ? IMG_PATH + poster_path 
                    : 'https://via.placeholder.com/500x750?text=No+Image';

                movieEl.innerHTML = `
                    <img src="${imageSrc}" alt="${title}">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <span class="${getClassByRate(vote_average)}">${vote_average ? vote_average.toFixed(1) : 'N/A'}</span>
                    </div>
                    <div class="overview">
                        <h3>القصة</h3>
                        <p>${overview || 'لا يوجد وصف متاح لهذا الفيلم حالياً.'}</p>
                    </div>
                `;

                main.appendChild(movieEl);
            });
        }

        function getClassByRate(vote) {
            if (vote >= 8) return 'green';
            if (vote >= 5) return 'orange';
            return 'red';
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const searchTerm = search.value.trim();

            if (searchTerm && searchTerm !== '') {
                getMovies(SEARCH_API + encodeURIComponent(searchTerm));
                search.value = '';
            } else {
                window.location.reload();
            }
        });
    </script>
</body>
</html>
